[project]
name = "archaeostone-atlas-ai"
version = "0.1.0"
description = "ArchaeoStone Atlas AI — 日本の黒曜石原産地とその足もとの地質"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "requests>=2.32",
  "lxml>=5.0",
  "xlrd>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["archaeostone*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

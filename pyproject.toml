[project]
name = "archaeostone-atlas-ai"
version = "0.1.0"
description = "ArchaeoStone Atlas AI — 日本の黒曜石原産地とその足もとの地質"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "requests>=2.32",
  "lxml>=5.0",
  "xlrd>=2.0",
  "PyYAML>=6.0",
  # L1: 地質タイルの復号(pipeline.build_control_points)
  "Pillow>=11.0",
  # L3: 原産地らしさの分類器と評価(archaeostone.likeness / tests)
  "numpy>=2.0",
  "scikit-learn>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["archaeostone*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
